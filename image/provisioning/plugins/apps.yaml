apiVersion: 1

# Enable the Vulnobs app in the image, so its pages show up without a manual
# step. Ingested scans are stored by the authenticated storage API.
apps:
  - type: 'rupeshkoushik07-vulnobs-app'
    org_id: 1
    disabled: false
    jsonData:
      storageUrl: 'http://vulnobs-storage:8080'
      # Empty unless the deployment sets them: "remote" makes the app use a
      # Prometheus data source and the scan agent instead of the Kubernetes
      # API (see deploy/tanka/README.md).
      clusterMode: '$VULNOBS_CLUSTER_MODE'
      prometheusDatasourceUid: '$VULNOBS_PROMETHEUS_DATASOURCE_UID'
    secureJsonData:
      storageToken: '$VULNOBS_STORAGE_TOKEN'
      scannerToken: '$VULNOBS_SCANNER_TOKEN'

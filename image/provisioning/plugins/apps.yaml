apiVersion: 1

# Enable the Vulnobs app in the image, so its pages show up without a manual
# step. Ingested scans are stored by the authenticated storage API.
apps:
  - type: 'rupeshkoushik07-vulnobs-app'
    org_id: 1
    disabled: false
    jsonData:
      storageUrl: 'http://vulnobs-storage:8080'
    secureJsonData:
      storageToken: '$VULNOBS_STORAGE_TOKEN'

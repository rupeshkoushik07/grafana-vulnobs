# Generated by tools/export-flux-manifests.sh from deploy/tanka/environments/default. Do not edit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnobs-scan
  namespace: vulnobs
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: vulnobs-scan
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -eu
              pushed=0
              for q in /work/reports/*.query; do
                [ -e "$q" ] || continue
                report="${q%.query}.json"
                curl -fsS -X POST "$VULNOBS_API/ingest?$(cat "$q")" \
                  -H 'Content-Type: application/json' --data-binary @"$report" > /dev/null
                pushed=$((pushed + 1))
              done
              echo "pushed $pushed scans"
              curl -fsS -X POST "$VULNOBS_API/prune" \
                -H 'Content-Type: application/json' --data-binary @/work/prune.json
              echo
            command:
            - /bin/sh
            - -c
            env:
            - name: VULNOBS_API
              value: http://grafana.vulnobs.svc:3000/api/plugins/rupeshkoushik07-vulnobs-app/resources
            image: curlimages/curl:8.22.0
            name: push
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 100
            volumeMounts:
            - mountPath: /work
              name: work
          initContainers:
          - args:
            - -exclude-namespaces
            - kube-system,kube-public,kube-node-lease,local-path-storage
            - -targets
            - /work/targets.tsv
            - -prune
            - /work/prune.json
            command:
            - vulnobs-discover
            image: ghcr.io/rupeshkoushik07/grafana-vulnobs:main
            name: discover
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /work
              name: work
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: kube-api
              readOnly: true
          - args:
            - |
              set -u
              mkdir -p /work/reports
              tab="$(printf '\t')"
              n=0; ok=0; failed=0
              while IFS="$tab" read -r image query; do
                [ -n "$image" ] || continue
                n=$((n + 1))
                echo "scanning $image"
                if trivy image --quiet --scanners vuln --format json --timeout 15m \
                    --cache-dir /work/cache --output "/work/reports/$n.json" "$image"; then
                  printf '%s\n' "$query" > "/work/reports/$n.query"
                  ok=$((ok + 1))
                else
                  echo "could not scan $image; skipping it" >&2
                  rm -f "/work/reports/$n.json"
                  failed=$((failed + 1))
                fi
              done < /work/targets.tsv
              echo "scanned $ok of $n images ($failed failed)"
            command:
            - /bin/sh
            - -c
            image: ghcr.io/aquasecurity/trivy:0.74.0
            name: trivy
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 250m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /work
              name: work
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: vulnobs-scanner
          volumes:
          - emptyDir: {}
            name: work
          - name: kube-api
            projected:
              sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  items:
                  - key: ca.crt
                    path: ca.crt
                  name: kube-root-ca.crt
  schedule: 0 * * * *

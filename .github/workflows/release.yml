name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Fail the build instead of silently resolving a module that go.mod/go.sum
  # don't already pin.
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: Package ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [rupesh-vulnobs-app, rupesh-vulnobs-datasource]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json

      - name: Install & build frontend
        working-directory: ${{ matrix.plugin }}
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Build backend (all architectures)
        working-directory: ${{ matrix.plugin }}
        run: mage -v buildAll

      # Signing is optional: it only runs when a Grafana access-policy token is
      # configured as a repo secret. Without it we still ship an unsigned build.
      - name: Sign plugin
        working-directory: ${{ matrix.plugin }}
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            npm run sign
          else
            echo "::warning::No GRAFANA_ACCESS_POLICY_TOKEN secret set — producing an UNSIGNED build."
          fi

      - name: Package
        working-directory: ${{ matrix.plugin }}
        run: |
          mv dist "${{ matrix.plugin }}"
          zip -r "../${{ matrix.plugin }}-${{ github.ref_name }}.zip" "${{ matrix.plugin }}"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ matrix.plugin }}-${{ github.ref_name }}.zip
          generate_release_notes: true

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: Package Vulnobs App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rupesh-vulnobs-app/package-lock.json

      - name: Build app and nested datasource frontends
        working-directory: rupesh-vulnobs-app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:ci
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rupesh-vulnobs-app/go.mod
          cache-dependency-path: |
            rupesh-vulnobs-app/go.sum
            rupesh-vulnobs-datasource/go.sum

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Build app backend (all architectures)
        working-directory: rupesh-vulnobs-app
        run: mage -v buildAll

      - name: Build nested datasource backend (all architectures)
        working-directory: rupesh-vulnobs-datasource
        run: mage -v buildAll

      - name: Assemble bundled App
        run: mkdir -p rupesh-vulnobs-app/dist/datasource && cp rupesh-vulnobs-datasource/dist/gpx_vulnobs_* rupesh-vulnobs-app/dist/datasource/

      # Signing covers the single distributable App package, including the
      # nested datasource frontend and backend.
      - name: Sign plugin
        working-directory: rupesh-vulnobs-app
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            npm run sign
          else
            echo "::warning::No GRAFANA_ACCESS_POLICY_TOKEN secret set — producing an UNSIGNED build."
          fi

      - name: Package
        run: |
          mv rupesh-vulnobs-app/dist rupeshkoushik07-vulnobs-app
          zip -r "rupeshkoushik07-vulnobs-app-${GITHUB_REF_NAME}.zip" rupeshkoushik07-vulnobs-app

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: rupeshkoushik07-vulnobs-app-${{ github.ref_name }}.zip
          generate_release_notes: true

# A known-vulnerable Log4Shell test app, deployed on its own by
# `tools/kind-demo.sh add-vulnerable` to show a new workload turning up on the
# Assets page as "not scanned yet". Never run it anywhere that matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: payments-api
          image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
          resources:
            limits: {memory: 384Mi}

name: Kubernetes

# Deploys the stack to a throwaway kind cluster with Tanka and checks it end to
# end: Grafana with both plugins, the provisioned data source and dashboard,
# and one run of the scheduled Trivy scan pushing its report into /ingest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TANKA_VERSION: v0.39.1
  # The scan job checks the published Vulnobs image itself.
  SCAN_TARGET: ghcr.io/rupeshkoushik07/grafana-vulnobs:main

jobs:
  deploy:
    name: Deploy with Tanka and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the image from this commit, so pull requests are tested too.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vulnobs:ci
          cache-from: type=gha

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: vulnobs

      - name: Load image into kind
        run: kind load docker-image vulnobs:ci --name vulnobs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rupesh-vulnobs-app/go.mod
          cache: false

      # Tanka publishes no checksums for its release binaries. Building from
      # source verifies it against the Go checksum database instead.
      - name: Install Tanka
        run: go install "github.com/grafana/tanka/cmd/tk@${TANKA_VERSION}"

      - name: Deploy with Tanka
        working-directory: deploy/tanka
        run: |
          tk env set environments/default \
            --server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          tk apply environments/default --auto-approve always \
            --tla-str imageRepository=vulnobs \
            --tla-str imageTag=ci \
            --tla-str targetImage="${SCAN_TARGET}"
          kubectl -n vulnobs rollout status deployment/grafana --timeout=5m

      - name: Check plugins and provisioning
        run: |
          kubectl -n vulnobs port-forward svc/grafana 3000:3000 > /tmp/port-forward.log 2>&1 &
          G=http://admin:admin@127.0.0.1:3000
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$G/api/health"

          echo "Both plugins are loaded:"
          for p in rupesh-vulnobs-app rupesh-vulnobs-datasource; do
            curl -fsS "$G/api/plugins/$p/settings" | jq -c '{id, signature, version: .info.version}'
          done

          echo "The app is enabled:"
          curl -fsS "$G/api/plugins/rupesh-vulnobs-app/settings" | jq -e '.enabled == true'

          echo "The provisioned data source reaches OSV:"
          curl -fsS "$G/api/datasources/uid/vulnobs-osv/health" | jq -e '.status == "OK"'

          echo "The demo dashboard is provisioned:"
          curl -fsS "$G/api/dashboards/uid/vulnobs-demo" | jq -e '.dashboard.title'

      # Trigger the CronJob now instead of waiting for its schedule: Trivy scans
      # the target image and curl pushes the report to the app's /ingest.
      - name: Run the scheduled Trivy scan once
        run: |
          kubectl -n vulnobs create job scan-ci --from=cronjob/vulnobs-scan
          kubectl -n vulnobs wait --for=condition=complete job/scan-ci --timeout=15m

          kubectl -n vulnobs port-forward svc/grafana 3000:3000 > /tmp/port-forward.log 2>&1 &
          G=http://admin:admin@127.0.0.1:3000
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$G/api/health" > /dev/null

          asset="${SCAN_TARGET//\//_}"
          echo "Ingested posture for ${asset}:"
          curl -fsS "$G/api/plugins/rupesh-vulnobs-app/resources/assets" \
            | jq -e --arg a "$asset" '.assets[] | select(.asset == $a)'

      - name: Show cluster state
        if: failure()
        run: |
          kubectl -n vulnobs get all
          kubectl -n vulnobs describe pods
          kubectl -n vulnobs logs deployment/grafana --tail=200
          kubectl -n vulnobs logs job/scan-ci --all-containers --tail=200 || true

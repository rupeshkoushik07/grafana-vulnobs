apiVersion: 1

# The OSV data source also reads scans ingested by the Vulnobs app through its
# authenticated storage API, so dashboards and alert rules can use them.
datasources:
  - name: 'Vulnobs OSV'
    uid: 'vulnobs-osv'
    type: 'rupeshkoushik07-vulnobs-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    # Bump this when changing the settings below, so Grafana applies them to a
    # data source it already has from an earlier version of the image.
    version: 3
    editable: true
    jsonData:
      storageUrl: 'http://vulnobs-storage:8080'
    secureJsonData:
      storageToken: '$VULNOBS_STORAGE_TOKEN'
